services:
  tailscale-client:
    image: 'tailscale/tailscale:latest'
    hostname: '${TS_HOSTNAME:-coolify-ts}'
    ports:
      - '32400:32400'
    environment:
      - 'TS_HOSTNAME=${TS_HOSTNAME:-coolify-ts}'
      - 'TS_AUTHKEY=${TS_AUTHKEY:?}'
      - 'TS_STATE_DIR=${TS_STATE_DIR:-/var/lib/tailscale}'
      - 'TS_USERSPACE=${TS_USERSPACE:-false}'
      - TS_SERVE_CONFIG=/var/lib/tailscale/serve.json
    volumes:
      - 'tailscale-client:/var/lib/tailscale'
    devices:
      - '/dev/net/tun:/dev/net/tun'
    cap_add:
      - net_admin
    networks:
      - coolify
      - hiym9vlva60bp7lduwfln4fj
      - ith13tgxvl3kh59c2v9qpnzb
      - jfxr7n8qtnmb2hvrd8yqw69c
    healthcheck:
      test:
        - CMD-SHELL
        - "tailscale status --json | grep -q 'BackendState'"
      interval: 10s
      timeout: 5s
      retries: 5
  nginx:
    image: 'nginx:latest'
    depends_on:
      - tailscale-client
    network_mode: 'service:tailscale-client'
    volumes:
      - 'tailscale-client:/var/lib/tailscale'
    entrypoint:
      - /bin/sh
      - '-c'
      - "cat << 'INNER_EOF' > /var/lib/tailscale/serve.json\n{\n  \"TCP\": {\n    \"443\": {\n      \"HTTPS\": true\n    }\n  },\n  \"Web\": {\n    \"$${TS_CERT_DOMAIN}:443\": {\n      \"Handlers\": {\n        \"/\": {\n          \"Proxy\": \"http://127.0.0.1:80\"\n        }\n      }\n    }\n  }\n}\nINNER_EOF\ncat << 'INNER_EOF' > /etc/nginx/nginx.conf\nuser nginx;\nworker_processes auto;\nerror_log /var/log/nginx/error.log notice;\npid /var/run/nginx.pid;\nevents {\n    worker_connections 1024;\n}\nhttp {\n    include /etc/nginx/mime.types;\n    default_type application/octet-stream;\n    sendfile on;\n    keepalive_timeout 65;\n\n    server {\n        listen 80;\n        listen [::]:80;\n        server_name localhost 127.0.0.1 ::1;\n        location / {\n            return 200 'OK';\n            add_header Content-Type text/plain;\n        }\n    }\n\n    server {\n        listen 80 default_server;\n        listen [::]:80 default_server;\n\n        location /transmission/ {\n            proxy_pass http://transmission:9091/transmission/;\n            proxy_set_header Host $$host;\n            proxy_set_header X-Real-IP $$remote_addr;\n            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto https;\n            proxy_http_version 1.1;\n            proxy_set_header Upgrade $$http_upgrade;\n            proxy_set_header Connection \"upgrade\";\n            proxy_connect_timeout 60s;\n            proxy_send_timeout 60s;\n            proxy_read_timeout 600s;\n        }\n\n        location /filebrowser/ {\n            proxy_pass http://filebrowser:80/filebrowser/;\n            proxy_set_header Host $$host;\n            proxy_set_header X-Real-IP $$remote_addr;\n            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto https;\n            proxy_http_version 1.1;\n            proxy_set_header Upgrade $$http_upgrade;\n            proxy_set_header Connection \"upgrade\";\n            proxy_connect_timeout 60s;\n            proxy_send_timeout 60s;\n            proxy_read_timeout 600s;\n        }\n\n        location / {\n            proxy_pass http://coolify:8080;\n            proxy_set_header Host $$host;\n            proxy_set_header X-Real-IP $$remote_addr;\n            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto https;\n            proxy_http_version 1.1;\n            proxy_set_header Upgrade $$http_upgrade;\n            proxy_set_header Connection \"upgrade\";\n            proxy_connect_timeout 60s;\n            proxy_send_timeout 60s;\n            proxy_read_timeout 600s;\n        }\n    }\n}\nINNER_EOF\nexec nginx -g \"daemon off;\"\n"
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - 'http://127.0.0.1:80/'
        - '-o'
        - /dev/null
      interval: 20s
      timeout: 5s
      retries: 3
  plex:
    image: 'lscr.io/linuxserver/plex:latest'
    depends_on:
      - tailscale-client
    network_mode: 'service:tailscale-client'
    environment:
      - PUID=1000
      - PGID=1000
      - 'TZ=${TZ:-Europe/Budapest}'
      - 'PLEX_CLAIM=${PLEX_CLAIM}'
    volumes:
      - 'plex-config:/config'
      - 'plex-tv:/tv'
      - '/srv/media/media:/movies:ro'
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - 'http://localhost:32400/identity'
      interval: 10s
      timeout: 10s
      retries: 15
networks:
  coolify:
    external: true
  hiym9vlva60bp7lduwfln4fj:
    external: true
  ith13tgxvl3kh59c2v9qpnzb:
    external: true
  jfxr7n8qtnmb2hvrd8yqw69c:
    external: true
volumes:
  tailscale-client: null
  plex-config: null
  plex-tv: null
