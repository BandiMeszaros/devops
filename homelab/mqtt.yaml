services:
  mosquitto:
    image: 'eclipse-mosquitto:2'
    restart: unless-stopped
    environment:
      - 'MQTT_USER=${MQTT_USER}'
      - 'MQTT_PASSWORD=${MQTT_PASSWORD}'
    ports:
      - '192.168.1.160:1883:1883'
    volumes:
      -
        type: bind
        source: ./mosquitto.conf
        target: /mosquitto/config/mosquitto.conf
      - 'mosquitto-data:/mosquitto/data'
    command: "sh -c 'mosquitto_passwd -c -b /mosquitto/config/passwd \"$$MQTT_USER\" \"$$MQTT_PASSWORD\" &&\n       chown mosquitto:mosquitto /mosquitto/config/passwd &&\n       chmod 0600 /mosquitto/config/passwd &&\n       exec mosquitto -c /mosquitto/config/mosquitto.conf'\n"
volumes:
  mosquitto-data: null
